{% extends "base.html" %}
{% block title %}VeriLLM Chat{% endblock %}
{% block content %}

<h4 class="mb-4">Secure Inference Session</h4>

<div class="card mb-4">
    <div class="card-body">
        <textarea id="promptInput" class="form-control mb-3"
                  rows="3"
                  placeholder="Enter your prompt..."></textarea>

        <button class="btn btn-primary" onclick="sendPrompt()">
            Send
        </button>
    </div>
</div>

<div id="chatOutput"></div>

<script>
async function sendPrompt() {
    const prompt = document.getElementById("promptInput").value;

    if (!prompt) return;

    const response = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            model: "Qwen/Qwen2.5-7B-Instruct-AWQ",
            temperature: 0.0,
            messages: [
                { role: "user", content: prompt }
            ]
        })
    });

    const data = await response.json();

    const sessionId = data.id || data.session_id || "unknown";

    const assistantText = data.choices[0].message.content;

    const chatDiv = document.getElementById("chatOutput");

    chatDiv.innerHTML = `
        <div class="card mb-3">
            <div class="card-body">
                <strong>User:</strong>
                <pre>${prompt}</pre>
                <strong>Assistant:</strong>
                <pre>${assistantText}</pre>
                <div class="mt-3">
                    <button class="btn btn-success"
                        onclick="replaySession('${data.session_id}')">
                        Replay & Verify
                    </button>
                </div>
                <div id="replayResult"></div>
            </div>
        </div>
    `;
}

async function replaySession(sessionId) {

    const response = await fetch(`/replay/${sessionId}`);
    const result = await response.json();

    const replayDiv = document.getElementById("replayResult");

    if (result.signature_valid && result.match) {
        replayDiv.innerHTML = `
            <div class="alert alert-success mt-3">
                Signature Valid ✓ <br>
                Deterministic Match ✓
            </div>
        `;
    } else {
        replayDiv.innerHTML = `
            <div class="alert alert-danger mt-3">
                Verification Failed
            </div>
        `;
    }
}
</script>

{% endblock %}

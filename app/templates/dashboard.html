<!DOCTYPE html>
<html>
<head>
    <title>VeriLLM Audit Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">VeriLLM Execution Audit Console</h2>

    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Session ID</th>
                <th>Model</th>
                <th>Created</th>
                <th>View</th>
            </tr>
        </thead>
        <tbody>
            {% for session in sessions %}
            <tr>
                <td>{{ session[0] }}</td>
                <td>{{ session[1] }}</td>
                <td>{{ session[2] }}</td>
                <td>
                    <a href="/dashboard/session/{{ session[0] }}" class="btn btn-sm btn-primary">
                        Inspect
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>

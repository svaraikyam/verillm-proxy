<!DOCTYPE html>
<html>
<head>
    <title>Session Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h3>Session: {{ session_id }}</h3>

    <div class="card mt-4">
        <div class="card-body">
            <h5>Prompt</h5>
            <pre>{{ prompt }}</pre>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h5>Response</h5>
            <pre>{{ response }}</pre>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h6>Response Hash</h6>
            <code>{{ response_hash }}</code>
            <h6 class="mt-3">Session Hash</h6>
            <code>{{ session_hash }}</code>
        </div>
    </div>

    <div class="mt-4">
        <a href="/dashboard" class="btn btn-secondary">Back</a>
    </div>

</div>

</body>
</html>
